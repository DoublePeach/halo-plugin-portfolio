apiVersion: v1alpha1
kind: Role
metadata:
  name: portfolio-role-view-portfolios
  labels:
    halo.run/role-template: "true"
  annotations:
    rbac.authorization.halo.run/module: "Portfolio"
    rbac.authorization.halo.run/display-name: "查看作品集"
    rbac.authorization.halo.run/ui-permissions: |
      ["plugin:portfolio:portfolio:view"]
rules:
  - apiGroups: ["portfolio.plugin.halo.run"]
    resources: ["portfolio/portfolios"]
    verbs: ["get", "list"]
---
apiVersion: v1alpha1
kind: Role
metadata:
  name: portfolio-role-manage-portfolios
  labels:
    halo.run/role-template: "true"
  annotations:
    rbac.authorization.halo.run/dependencies: |
      ["role-template-portfolio-role-view-portfolios"]
    rbac.authorization.halo.run/module: "Portfolio"
    rbac.authorization.halo.run/display-name: "管理作品集"
    rbac.authorization.halo.run/ui-permissions: |
      ["plugin:portfolio:portfolio:manage"]
rules:
  - apiGroups: ["portfolio.plugin.halo.run"]
    resources: ["portfolio/portfolios"]
    verbs: ["*"]
---
